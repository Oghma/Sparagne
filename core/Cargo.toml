[package]
name = "sparagne_core"
version = "0.1.0"
description = "Sparagne v2 domain core: commands, per-vault log, SQLite projection"
edition = "2024"
rust-version = "1.92"
license = "MIT"
authors = ["Matteo Lisotto <matteo.lisotto@gmail.com>"]

# Standalone workspace: the v1 crates in ../crates pin an older libsqlite3-sys
# through sea-orm, and Cargo allows one native `sqlite3` link per workspace.
[workspace]

[lib]
name = "sparagne_core"
path = "src/lib.rs"

[dependencies]
chrono = { version = "0.4", features = ["serde", "clock"] }
rusqlite = { version = "0.40", features = ["bundled", "uuid"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"
