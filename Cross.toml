[target.x86_64-unknown-linux-gnu]
pre-build = [
  "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config; elif command -v apk >/dev/null 2>&1; then apk add --no-cache openssl-dev pkgconf; else echo \"no supported package manager\"; exit 1; fi",
]

[target.x86_64-unknown-linux-musl]
pre-build = [
  "if command -v apt-get >/dev/null 2>&1; then apt-get update && apt-get install -y --no-install-recommends libssl-dev pkg-config; elif command -v apk >/dev/null 2>&1; then apk add --no-cache openssl-dev pkgconf; else echo \"no supported package manager\"; exit 1; fi",
]
