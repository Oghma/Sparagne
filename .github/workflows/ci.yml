name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0
  RUSTFMT_TOOLCHAIN: nightly

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Use the pinned MSRV toolchain for build/test/clippy.
      - name: Install Rust 1.92.0 + clippy
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy

      # Use nightly rustfmt because `rustfmt.toml` uses nightly-only options.
      - name: Install nightly + rustfmt
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUSTFMT_TOOLCHAIN }}
          components: rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo +nightly fmt --all -- --check

      # Keep clippy non-blocking on warnings for now; tighten during the engine refactor.
      - name: Clippy
        run: cargo +${{ env.RUST_TOOLCHAIN }} clippy --workspace --all-targets

      - name: Clippy (no unwrap/expect)
        run: cargo +${{ env.RUST_TOOLCHAIN }} clippy --workspace --all-targets -- -D clippy::unwrap_used -D clippy::expect_used

      - name: Test
        run: cargo +${{ env.RUST_TOOLCHAIN }} test --workspace --all-targets
