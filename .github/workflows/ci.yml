name: CI

on:
  push:
    branches: [master, v2]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.92.0

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace --all-targets

  apple:
    # macOS 27 is the app's minimum, so its tests need a macOS 27 host with
    # Xcode 27. GitHub keys macOS images by Xcode major now, not by OS.
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Build the Swift package artefacts
        run: bash apple/build-core.sh

      - name: Check the committed bindings are up to date
        run: git diff --exit-code -- apple/SparagneCore/Sources/SparagneCore/SparagneCore.swift

      - name: Test the Swift package
        run: swift test --package-path apple/SparagneCore

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate the Xcode project
        run: xcodegen generate
        working-directory: apple/Sparagne

      - name: Build the app
        run: |
          xcodebuild -project Sparagne.xcodeproj -scheme Sparagne \
            -destination 'platform=macOS' build -quiet CODE_SIGNING_ALLOWED=NO
        working-directory: apple/Sparagne

      - name: Test the app
        run: |
          xcodebuild -project Sparagne.xcodeproj -scheme Sparagne \
            -destination 'platform=macOS' test -quiet CODE_SIGNING_ALLOWED=NO
        working-directory: apple/Sparagne

      - name: The app against the real server
        run: bash scripts/e2e.sh
