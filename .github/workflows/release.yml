name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build (${{ matrix.target }})
    runs-on: ubuntu-latest
    env:
      artifact: sparagne-${{ matrix.target }}.tar.gz
      RUST_TOOLCHAIN: 1.92.0
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - x86_64-unknown-linux-musl

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2

      - name: Install cross
        run: cargo install cross --locked

      - name: Build binaries
        run: cross build --release -p sparagne -p server -p sparagne_tui --target ${{ matrix.target }}

      - name: Package artifacts
        run: |
          mkdir -p dist
          tar -C target/${{ matrix.target }}/release -czf dist/${{ env.artifact }} sparagne server sparagne_tui

      - name: Publish release artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: dist/${{ env.artifact }}
          fail_on_unmatched_files: true
