[workspace]
members = ["core", "server"]
resolver = "3"

[workspace.package]
version = "2.0.0"
authors = ["Matteo Lisotto <matteo.lisotto@gmail.com>"]
license = "MIT"
# The crates ship as the app and the server image, never to crates.io.
publish = false
rust-version = "1.99"
edition = "2024"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
