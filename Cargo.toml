[workspace]
members = [
    "crates/app",
    "crates/admin_cli",
    "crates/engine",
    "crates/migration",
    "crates/server",
    "crates/telegram_bot",
    "crates/api_types",
    "crates/tui",
]
resolver = "3"

[workspace.package]
version = "0.93.0"
authors = ["Matteo Lisotto <matteo.lisotto@gmail.com>"]
license = "MIT"
rust-version = "1.92"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Workspace lints (requires a recent Cargo; align with CI Issue 16).
[workspace.lints.rust]
unsafe_code = "forbid"

# Keep Clippy baseline light for now; tighten during engine refactor.
[workspace.lints.clippy]
all = { level = "allow", priority = -1 }
pedantic = { level = "allow", priority = -1 }
nursery = { level = "allow", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
todo = "warn"
dbg_macro = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
async-trait = "0.1.89"
axum = "0.8.7"
axum-extra = "0.12.2"
base64 = "0.22.1"
clap = { version = "4.5.60", features = ["derive", "env"] }
chrono = { version = "0.4.44", features = ["serde", "clock"] }
chrono-tz = "0.10.4"
config = "0.15.21"
csv = "1.4.0"
crossterm = "0.29.0"
http-body-util = "0.1.3"
reqwest = { version = "0.13.2", default-features = false, features = ["json", "rustls"] }
ratatui = "0.30.0"
sea-orm = "1.0.1"
sea-orm-migration = { version = "1.0.1", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.148"
teloxide = { version = "0.17.0", default-features = false }
thiserror = "2.0.18"
tokio = "1.50.0"
time = "0.3.47"
tower = "0.5.3"
tracing = "0.1.44"
tracing-appender = "0.2.4"
tracing-subscriber = "0.3.23"
uuid = "1.22.0"
unicode-normalization = "0.1.23"
engine = { path = "crates/engine" }
migration = { path = "crates/migration" }
server = { path = "crates/server" }
telegram_bot = { path = "crates/telegram_bot" }
api_types = { path = "crates/api_types" }
