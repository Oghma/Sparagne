[files]
# The Italian deploy guide, and the string catalog with its Italian
# translations (its English keys are checked in the Swift that uses them).
extend-exclude = ["docs/**", "*.xcstrings"]

[default]
extend-ignore-re = [
  # Project name / brand.
  "Sparagne",
]

[default.extend-words]
sparagne = "sparagne"
# Italian words in fixtures and tests: category and envelope names, the v1
# import's data.
alle = "alle"
categorie = "categorie"
comune = "comune"
contanti = "contanti"
