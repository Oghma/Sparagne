# Run from server/deploy/:
#
#   cp .env.example .env   # edit DOMAIN and the rest
#   # edit Caddyfile: replace sparagne.example.com with the real domain
#   docker compose up -d
#
# Backups: `docker compose exec sparagne backup.sh` writes straight to
# ./backups on the host (server/deploy/backup.sh ships inside the image).
#
# Accounts, with registration closed or open:
#   printf '%s\n' "$PW" | docker compose exec -T sparagne sparagne-server user add alice
#   docker compose exec sparagne sparagne-server user list
#
# See docs/v2/DEPLOY.md for the full first-run flow, accounts, backups and
# upgrades.

services:
  sparagne:
    build:
      context: ../..
      dockerfile: server/Dockerfile
    image: sparagne-server:latest
    restart: unless-stopped
    volumes:
      - sparagne-data:/data
      - ./backups:/backups
    environment:
      SPARAGNE_ALLOW_REGISTRATION: ${SPARAGNE_ALLOW_REGISTRATION:-true}
      SPARAGNE_TOKEN_TTL_DAYS: ${SPARAGNE_TOKEN_TTL_DAYS:-30}
      # Port 3000 is not published: only Caddy reaches this container, and
      # Caddy sets X-Forwarded-For to the real client, which the login and
      # registration limits then key on. Publish the port and this must go.
      SPARAGNE_TRUST_PROXY: ${SPARAGNE_TRUST_PROXY:-true}
      SPARAGNE_LOGIN_MAX_FAILURES: ${SPARAGNE_LOGIN_MAX_FAILURES:-5}
      SPARAGNE_LOGIN_WINDOW_SECS: ${SPARAGNE_LOGIN_WINDOW_SECS:-900}
      SPARAGNE_IP_MAX_FAILURES: ${SPARAGNE_IP_MAX_FAILURES:-30}
      RUST_LOG: ${RUST_LOG:-info}
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - sparagne
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  sparagne-data:
  caddy-data:
  caddy-config:
